<!DOCTYPE html>
<html>
<head>
    <title>Watch Store - Cart</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <a href="index.html"><img src="/assets/logo.png" alt="ORA" width="150px" height="40px"></a>    </div>
    <div class="links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<section class="page-hero">
    <h1>Your Cart</h1>
    <p>Review items and proceed to payment.</p>
</section>

<section class="cart-section">
    <div class="cart-list" id="cartList"></div>
    <div class="cart-summary">
        <p><strong>Subtotal:</strong> <span id="cartSubtotal">NPR 0</span></p>
        <p><strong>Shipping:</strong> <span>NPR 0</span></p>
        <p><strong>Total:</strong> <span id="cartTotal">NPR 0</span></p>
    </div>
</section>

<section class="payment-section">
    <h2>Choose payment method</h2>
    <div class="payment-options">
        <label><input type="radio" name="payment" value="Khalti"> Khalti</label>
        <label><input type="radio" name="payment" value="Cash on Delivery"> Cash on Delivery</label>
    </div>
    <button id="payBtn">Pay Now</button>
    <p class="form-status" id="paymentStatus"></p>
</section>

<footer>
    <div class="footer-grid">
        <div>
            <h3>Need Help?</h3>
            <a href="about.html">Contact Us</a>
        </div>
        <div>
            <h3>Continue Shopping</h3>
            <a href="products.html">Products</a>
        </div>
        <div>
            <h3>Track</h3>
            <a href="profile.html">Profile / Tracking</a>
        </div>
    </div>
</footer>

</body>
</html>
